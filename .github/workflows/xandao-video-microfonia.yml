name: Xandao Video Microfonia ElevenLabs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/xandao-video-microfonia.yml'

permissions:
  contents: read
  actions: read

jobs:
  gerar-video:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obter composicao visual OpenMontage
        uses: actions/checkout@v4
        with:
          repository: xndmusic-star/openmontage
          ref: main
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar FFmpeg e Pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install "Pillow>=10,<13"
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Recuperar MP3 original aprovado na primeira execução
        uses: actions/download-artifact@v4
        with:
          name: xandao-locucao-elevenlabs-mp3
          run-id: 42532585777
          repository: xndmusic-star/elevenlabs-js
          github-token: ${{ github.token }}
          path: xandao-video/voice
      - name: Produzir video com MP3 aprovado
        run: python xandao-video/microfonia.py
      - name: Arquivo MP4 final
        uses: actions/upload-artifact@v4
        with:
          name: Xandao-Microfonia-ElevenLabs-MP4
          path: video-final/Xandao-Microfonia-ElevenLabs.mp4
          if-no-files-found: error
          retention-days: 7
